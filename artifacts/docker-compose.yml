# Static file server per pubblicare HTML condivisibili su artifacts.casita.monster.
# Container separato dal runner: monta solo la cartella html/ del workspace in RO,
# nessuna credenziale esposta. Deploy come stack Portainer "artifacts" su macpro.
# La conf nginx live sta in /workspace/.artifacts/nginx.conf (montata sotto).
services:
  artifacts:
    image: nginx:alpine
    container_name: artifacts
    restart: unless-stopped
    volumes:
      - /mnt/raid/tg-gp23/data/workspace/html:/usr/share/nginx/html:ro
      - /mnt/raid/tg-gp23/data/workspace/.artifacts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.artifacts.entrypoints=http"
      - "traefik.http.routers.artifacts.rule=Host(`artifacts.casita.monster`)"
      - "traefik.http.middlewares.artifacts-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.artifacts.middlewares=artifacts-https-redirect"
      - "traefik.http.routers.artifacts-secure.entrypoints=https"
      - "traefik.http.routers.artifacts-secure.rule=Host(`artifacts.casita.monster`)"
      - "traefik.http.routers.artifacts-secure.tls=true"
      - "traefik.http.routers.artifacts-secure.tls.certresolver=cloudflare"
      - "traefik.http.services.artifacts.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
