server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # niente indicizzazione motori di ricerca
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
